<style>
:root{--bg:#f1e3c8;--ink:#3a281f;--panel:#fff5df;--panel2:#f4e2bb;--line:#3a281f;--accent:#d98b45;--hi:#ffd77a}
body.night{--bg:#171a36;--ink:#f3e8d2;--panel:#252a55;--panel2:#1d2147;--line:#090b1c;--accent:#e8a45c;--hi:#6d5f2c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Pixelify Sans',ui-monospace,Menlo,Consolas,monospace;font-size:14px;transition:background .3s,color .3s;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:3px solid var(--line);background:var(--panel);flex:none}
.brand{font-weight:600;font-size:18px;margin-right:auto;white-space:nowrap;letter-spacing:.5px}
.btn{font:inherit;color:var(--ink);background:var(--panel);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);padding:4px 9px;cursor:pointer;border-radius:0;white-space:nowrap;line-height:1.2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.on{background:var(--hi)}
.btn.warn{background:#f3b3a6;color:#3a281f}
.btn:disabled{opacity:.4;pointer-events:none}
#ctx{flex:none;min-height:46px;display:flex;gap:7px;align-items:center;padding:6px 10px;overflow-x:auto;background:var(--panel2);border-bottom:3px solid var(--line);font-size:13px;white-space:nowrap}
#ctx .msg{margin-right:auto;opacity:.9;flex:1 1 auto;min-width:130px;white-space:normal;font-size:12.5px;line-height:1.25}
#ctx .btn{flex:none}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;min-width:0;position:relative;background-image:radial-gradient(rgba(0,0,0,.07) 1.5px,transparent 1.5px);background-size:16px 16px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 12px;border:3px solid var(--line);opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#panel{flex:none;height:42%;min-height:200px;display:flex;flex-direction:column;border-top:3px solid var(--line);background:var(--panel)}
#tabs{display:flex;gap:5px;overflow-x:auto;padding:7px 8px;flex:none;background:var(--panel2);border-bottom:3px solid var(--line)}
#tabs .btn{padding:3px 10px}
#items{flex:1;overflow-y:auto;padding:9px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.card{font:inherit;color:var(--ink);background:var(--bg);border:3px solid var(--line);padding:3px 3px 4px;cursor:pointer;text-align:center;font-size:11px;line-height:1.15;border-radius:0}
.card canvas{display:block;width:100%;height:54px;image-rendering:pixelated}
.card.tall canvas{height:92px}
.card span{display:block;margin-top:2px}
.card.on{background:var(--hi);box-shadow:0 0 0 2px var(--accent)}
.card:active{transform:translateY(1px)}
.sec{font-weight:600;margin:12px 0 7px;font-size:13px;opacity:.85}
.sec:first-child{margin-top:0}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:6px 0}
.dots{display:flex;gap:2px;justify-content:center;margin:3px 0}
.dots i{width:12px;height:12px;border:2px solid var(--line);display:block}
.note{font-size:12px;opacity:.8;margin:6px 0;line-height:1.35}
.step{display:flex;align-items:center;gap:6px}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9;padding:14px}

}
#hud{flex:none;display:flex;gap:6px;align-items:center;padding:5px 10px;background:var(--panel2);border-bottom:3px solid var(--line);overflow-x:auto;white-space:nowrap}

.mcard{font:inherit;color:var(--ink);background:var(--bg);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);padding:12px;cursor:pointer;text-align:left;flex:1 1 200px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.35}

.recap .big{font-size:26px;font-weight:600;text-align:center;margin:2px 0 8px;color:#2f7a3a}
.rl{display:flex;justify-content:space-between;padding:3px 0;border-bottom:2px dashed rgba(0,0,0,.18)}
.tk{display:block;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:3px solid var(--line);padding:6px 8px;margin:0 0 7px;text-align:left;cursor:pointer}
.tk.rdy{background:#c9f0c4;color:#23421b}
.tkt{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px}
.pbar{display:block;flex:1;height:8px;border:2px solid var(--line);background:#fff}

.tki{display:flex;align-items:center;gap:8px;font-size:13px;padding:2px 0}

@media (max-width:480px){.brand{font-size:15px}.top{gap:4px;padding:6px}.top .btn{padding:3px 7px}}

<div id="app">

<div id="modal" hidden><div class="box"><img id="shotImg" alt="Foto ruangan"><div class="note">Di HP: tahan gambar lalu simpan. Di laptop: klik kanan, simpan gambar.</div><button class="btn" id="bClose">Tutup</button></div></div>

<script>
(()=>{
'use strict';
/* ============================================================
   Ruang Kopi — isometric pixel cafe decorator
   Semua sprite digambar dari kode (voxel-ish box/cylinder),
   jadi tidak ada gambar eksternal.
   Satuan: 1 tile = 8u. 1u horizontal = 2px, vertikal = 1px. z dalam px.
   ============================================================ */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(a,b=0,c=0){let h=Math.imul(a|0,374761393)^Math.imul(b|0,668265263)^Math.imul(c|0,2147483647);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
const _rgbc={};
function hex2rgb(h){let v=_rgbc[h];if(v)return v;let s=h.replace('#','');if(s.length===3)s=s.split('').map(c=>c+c).join('');const n=parseInt(s,16);return _rgbc[h]=[(n>>16)&255,(n>>8)&255,n&255];}
const _sc={};
function shade(hex,f){const k=hex+'|'+f;let v=_sc[k];if(v)return v;const o=hex2rgb(hex).map(x=>clamp(Math.round(f>1?x+(255-x)*(f-1)*1.5:x*f),0,255));return _sc[k]='rgb('+o[0]+','+o[1]+','+o[2]+')';}
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const R=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};

const WALL_H=88, SLAB=8, MARGIN=14, PAD=3, WP=2;
const OUTC=[42,28,26];
let OX=0,OY=0;

/* ---------------- tema warna furnitur ---------------- */
const THEMES={
  japandi:{name:'Japandi',wood:'#d3a56c',wood2:'#a97b48',top:'#efe6d4',fabric:'#8fa385',accent:'#d0764b',pot:'#e5dccb'},
  industrial:{name:'Industrial',wood:'#8a6446',wood2:'#3d424a',top:'#9a9da3',fabric:'#8a4a36',accent:'#e0a431',pot:'#3d424a'},
  vintage:{name:'Vintage',wood:'#8b4f2e',wood2:'#5a2f1b',top:'#f1e2c3',fabric:'#9a3140',accent:'#dca83f',pot:'#b8693a'},
  pastel:{name:'Pastel',wood:'#f0d3c4',wood2:'#dfae9d',top:'#ffffff',fabric:'#f2a9c1',accent:'#9fd9cb',pot:'#f6c4d6'},
  midnight:{name:'Midnight',wood:'#4a4268',wood2:'#2c2745',top:'#6a6086',fabric:'#4a6fb0',accent:'#f2c14e',pot:'#383256'},
  tropis:{name:'Tropis Rotan',wood:'#cfa970',wood2:'#6f5233',top:'#f3ead3',fabric:'#5b8f6e',accent:'#e08a4a',pot:'#d4b18a'},
  warkop:{name:'Retro Warkop',wood:'#b98a52',wood2:'#6d4426',top:'#efe7d2',fabric:'#3f808f',accent:'#d9453a',pot:'#c9784a'},
  beton:{name:'Beton Minimalis',wood:'#bda587',wood2:'#35353a',top:'#dcdcd7',fabric:'#a9a193',accent:'#e8573a',pot:'#cbc6bb'},
  akademia:{name:'Dark Academia',wood:'#5e3f2c',wood2:'#2e1f16',top:'#d9c9a5',fabric:'#2f5a47',accent:'#c9a14a',pot:'#3b4b3e'},
  sore:{name:'Golden Hour',wood:'#cc8e5c',wood2:'#7e4b36',top:'#f7e9d9',fabric:'#d97a5a',accent:'#f3b94d',pot:'#e8c9a6'}
};
const THEME_IDS=Object.keys(THEMES);
const FIXED={metal:'#bfc6ce',dark:'#34333b',black:'#1e1c22',cream:'#f4ead3',white:'#f6f4ef',glass:'#b9e1ee',plant:'#4d9b48',plant2:'#357a3c',red:'#cc4a3c',gold:'#e6b84a',skin:'#f0c8a0',coffee:'#5a3520',screen:'#7fd6c2',brown:'#6f4730',hair:'#3a2a22'};
function slotColor(s,theme){if(s[0]==='#')return s;const t=THEMES[theme];return (t&&t[s])||FIXED[s]||'#ff00ff';}

/* ---------------- primitif gambar iso ---------------- */
function drawBox(g,ax,ay,p,col,sh){
  sh=sh||1;
  const w=p.w,d=p.d,h=p.h;
  const tx=ax+2*(p.x-p.y), ty=ay+(p.x+p.y)-(p.z+h);
  const cL=shade(col,.95*sh), cR=shade(col,.74*sh), cT=shade(col,1.14*sh);
  g.fillStyle=cL;
  const lx=tx-2*d, ly=ty+d;
  for(let c=0;c<2*w;c++) g.fillRect(lx+c,ly+(c>>1),1,h+1);
  g.fillStyle=cR;
  const bx=tx+2*(w-d), by=ty+w+d;
  for(let c=0;c<2*d;c++) g.fillRect(bx+c,by-1-(c>>1),1,h+1);
  g.fillStyle=cT;
  for(let r=0;r<w+d;r++){
    const l=r<d?tx-2*r-2:tx-2*d+2*(r-d);
    const rr=r<w?tx+2*r+2:tx+2*w-2*(r-w);
    g.fillRect(l,ty+r,rr-l,1);
  }
}
function drawCyl(g,ax,ay,p,col,sh){
  sh=sh||1;
  const cx=ax+2*(p.x-p.y), cy=ay+(p.x+p.y)-p.z;
  const rx=Math.max(p.r<1?1:2,Math.round(2.83*p.r)), ry=Math.max(1,Math.round(1.41*p.r));
  const cT=shade(col,1.14*sh), c1=shade(col,1.0*sh), c2=shade(col,.85*sh), c3=shade(col,.68*sh);
  const es=[];
  for(let dx=-rx;dx<rx;dx++){
    const u=(dx+.5)/rx;
    const e=Math.max(1,Math.round(ry*Math.sqrt(1-u*u)));
    es.push(e);
    g.fillStyle=u<-.35?c1:(u<.4?c2:c3);
    g.fillRect(cx+dx,cy-p.h,1,p.h+e);
  }
  g.fillStyle=cT;
  for(let dx=-rx,i=0;dx<rx;dx++,i++){const e=es[i];g.fillRect(cx+dx,cy-p.h-e,1,2*e);}
}
function outline(cv){
  const w=cv.width,h=cv.height,g=cv.getContext('2d'),img=g.getImageData(0,0,w,h),d=img.data,o=new Uint8ClampedArray(d);
  const A=(x,y)=>(x<0||y<0||x>=w||y>=h)?0:d[(y*w+x)*4+3];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    if(d[i+3]>=40)continue;
    if(A(x-1,y)>=40||A(x+1,y)>=40||A(x,y-1)>=40||A(x,y+1)>=40){o[i]=OUTC[0];o[i+1]=OUTC[1];o[i+2]=OUTC[2];o[i+3]=255;}
  }
  img.data.set(o);g.putImageData(img,0,0);
}
const bnd=p=>p.t==='b'?[p.x,p.x+p.w,p.y,p.y+p.d,p.z,p.z+p.h]:[p.x-p.r,p.x+p.r,p.y-p.r,p.y+p.r,p.z,p.z+p.h];
function sortBoxes(list,getB){
  const n=list.length,bs=list.map(getB),before=Array.from({length:n},()=>[]);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    if(i===j)continue;const a=bs[i],b=bs[j];
    const ab=a[1]<=b[0]||a[3]<=b[2]||(a.length>4&&a[5]<=b[4]);
    const ba=b[1]<=a[0]||b[3]<=a[2]||(a.length>4&&b[5]<=a[4]);
    if(ab&&!ba)before[j].push(i);
  }
  const out=[],st=new Array(n).fill(0);
  const visit=i=>{if(st[i])return;st[i]=1;for(const k of before[i])visit(k);out.push(list[i]);};
  for(let i=0;i<n;i++)visit(i);
  return out;
}
function fillTile(g,tx,ty,color){g.fillStyle=color;for(let r=0;r<16;r++){const hw=2*Math.min(r,15-r)+2;g.fillRect(tx-hw,ty+r,hw*2,1);}}

/* ---------------- katalog item ---------------- */
const DEFS={}, CATS={barista:[],dine:[],dekor:[],dinding:[]};
function def(o){DEFS[o.id]=o;CATS[o.cat].push(o.id);return o;}
const B=(x,y,z,w,d,h,c,o)=>({t:'b',x,y,z,w,d,h,c,o:o||null});
const C=(x,y,z,r,h,c,o)=>({t:'c',x,y,z,r,h,c,o:o||null});

const CT=20;
const counterBase=n=>{
  const L=8*n,p=[B(0,0,0,L,8,3,'wood2'),B(0,0,3,L-1,7,CT-5,'wood'),B(0,0,CT-2,L,8,2,'top')];
  for(let i=0;i<n;i++)p.push(B(8*i+1,7,5,6,1,CT-9,'wood2'));
  p.push(B(L-1,1,5,1,6,CT-9,'wood2'));
  return p;
};
const shelf=(fill)=>{
  const p=[B(0,0,0,8,1,38,'wood2'),B(0,0,0,1,4,38,'wood'),B(7,0,0,1,4,38,'wood')];
  [0,12,24,37].forEach(z=>p.push(B(0,0,z,8,4,1,'wood')));
  return p.concat(fill);
};
/* karakter manusia: sprite pixel-per-pixel (proporsi ~4 kepala, shading kiri-atas) */
function drawPerson(g,o,f,theme,back){
  const C=c=>c?slotColor(c,theme):null,dy=-f;
  const P=(x,y,c,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w||1,h||1);};
  const SB=(x,y,w,h,base)=>{P(x,y,base,w,h);if(w>2)P(x,y,shade(base,1.16),1,h);P(x+w-1,y,shade(base,.72),1,h);P(x,y+h-1,shade(base,.82),w,1);};
  const sk=o.skin||'#f0c8a0',skS=shade(sk,.8),skL=shade(sk,1.1);
  const pants=C(o.pants),shoe=C(o.shoes),sh=C(o.shirt),H=C(o.hair)||'#222';
  // kaki + sepatu / rok
  if(o.skirt){
    const sc=C(o.skirt);
    SB(6,31,3,5,sk);SB(9,31,3,5,sk);
    SB(5,35,4,3,shoe);SB(9,35,4,3,shoe);P(5,37,shade(shoe,.6),4,1);P(9,37,shade(shoe,.6),4,1);
    SB(5,24,8,8,sc);P(4,29,sc,10,3);P(4,29,shade(sc,1.16),1,3);P(13,29,shade(sc,.72),1,3);P(4,31,shade(sc,.8),10,1);
  }else{
    const w=o.baggy?5:4,lx=o.baggy?4:5,rx=lx+w;
    SB(lx,22,w,13,pants);SB(rx,22,w,13,pants);
    if(o.baggy){for(const x of [lx,rx]){P(x,31,shade(pants,.8),w,1);P(x+1,26,shade(pants,.86),w-2,2);}}
    SB(lx-1,34,w+1,4,shoe);SB(rx,34,w+1,4,shoe);
    P(lx-1,37,shade(shoe,.62),w+1,1);P(rx,37,shade(shoe,.62),w+1,1);
  }
  P(7,12+dy,skS,4,2);
  // badan

function text(g,s,x,y,c){g.fillStyle=c;for(const ch of s){const gl=FONT[ch];if(gl){for(let i=0;i<15;i++)if(gl[i]==='1')g.fillRect(x+(i%3),y+Math.floor(i/3),1,1);}x+=4;}}
function line(g,x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx-dy;g.fillStyle=c;for(;;){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>-dy){e-=dy;x0+=sx;}if(e2<dx){e+=dx;y0+=sy;}}}
function sky(g,x,y,w,h,night,seed){
  if(night){
    ['#0f1535','#162046','#1d2a5a'].forEach((c,i)=>R(g,x,y+Math.floor(h*i/3),w,Math.ceil(h/3),c));
    for(let i=0;i<6;i++)R(g,x+Math.floor(hash(i,seed,1)*(w-2)),y+Math.floor(hash(i,seed,2)*(h-6)),1,1,'#fff6c8');
    R(g,x+w-9,y+3,5,5,'#f6efc0');R(g,x+w-7,y+2,4,4,'#162046');
  }else{
    ['#8fd2ef','#a7dcf2','#c4e8f6'].forEach((c,i)=>R(g,x,y+Math.floor(h*i/3),w,Math.ceil(h/3),c));
    R(g,x+3,y+4,7,2,'#fff');R(g,x+5,y+3,5,1,'#fff');R(g,x+w-13,y+9,8,2,'#fff');R(g,x+w-11,y+8,5,1,'#fff');
    R(g,x,y+h-4,w,4,'#7cb86a');R(g,x+4,y+h-6,6,2,'#5f9c55');
  }
}
const winDraw=panes=>(g,w,h,o)=>{
  const th=THEMES[o.theme];
  R(g,0,0,w,h-3,th.wood2);sky(g,2,2,w-4,h-9,o.night,w);
  for(let i=1;i<panes;i++){const x=Math.round(i*(w-4)/panes)+2;R(g,x-1,2,2,h-9,th.wood2);}
  R(g,2,Math.round((h-9)/2)+1,w-4,2,th.wood2);
  R(g,0,h-4,w,4,shade(th.wood,1.1));R(g,0,h-4,w,1,'rgba(255,255,255,.4)');
};

/* ---------------- varian (rotasi) & sprite ---------------- */
function getVariant(d,rot,f){
  d._v=d._v||{};const k=rot+'|'+f;if(d._v[k])return d._v[k];
  let parts=d.P(f).map(p=>({...p})),fw=d.fw,fd=d.fd,cells=d.cells?d.cells.map(c=>[...c]):null;
  let fx=(d.fx||[]).map(o=>({...o})),light=(d.light&&d.light.x!=null)?{...d.light}:null;
  for(let i=0;i<rot;i++){
    const FD=fd*8;
    parts=parts.map(p=>p.t==='b'?{...p,x:FD-(p.y+p.d),y:p.x,w:p.d,d:p.w}:{...p,x:FD-p.y,y:p.x});
    fx=fx.map(o=>({...o,x:FD-o.y,y:o.x}));
    if(light)light={...light,x:FD-light.y,y:light.x};
    if(cells)cells=cells.map(([cx,cy])=>[fd-1-cy,cx]);
    [fw,fd]=[fd,fw];
  }
  return d._v[k]={fw,fd,cells,parts,fx,light};
}
const spriteCache={};
function buildPix(d,rot,theme,f,sit){
  const back=rot===1||rot===2,flip=rot===1||rot===3;let t=mkCanvas(18,38);
  drawPerson(t.getContext('2d'),d.pix,f,theme,back);
  if(sit){const t0=t;t=mkCanvas(18,38);const tg=t.getContext('2d');tg.imageSmoothingEnabled=false;tg.drawImage(t0,0,0,18,28,0,5,18,28);tg.drawImage(t0,0,34,18,4,0,33,18,4);}
  const cv=mkCanvas(40,48),c=cv.getContext('2d',{willReadFrequently:true}),ox=20,oy=32;
  if(flip){c.save();c.translate(ox+9,0);c.scale(-1,1);c.drawImage(t,0,oy-28);c.restore();}else c.drawImage(t,ox-9,oy-28);
  outline(cv);
  c.globalCompositeOperation='destination-over';c.fillStyle='rgba(0,0,0,.3)';
  [[5,6],[8,7],[9,8],[8,9],[5,10]].forEach(([hw,y])=>c.fillRect(ox-hw,oy+y,hw*2,1));
  c.globalCompositeOperation='source-over';
  return {cv,ox,oy,v:getVariant(d,rot,0)};
}
function getSprite(d,rot,theme,f){
  const key=d.id+'|'+rot+'|'+theme+'|'+f;if(spriteCache[key])return spriteCache[key];
  if(d.pix)return spriteCache[key]=buildPix(d,rot,theme,f);
  const v=getVariant(d,rot,f);let maxZ=0;for(const p of v.parts)maxZ=Math.max(maxZ,p.z+p.h);
  const w=16*(v.fw+v.fd)+PAD*2,h=8*(v.fw+v.fd)+maxZ+PAD*2+1,ox=16*v.fd+PAD,oy=maxZ+PAD;
  const cv=mkCanvas(w,h),g=cv.getContext('2d',{willReadFrequently:true});
  for(const p of sortBoxes(v.parts,bnd)){
    const col=slotColor(p.c,theme);

    (p.t==='b'?drawBox:drawCyl)(g,ox,oy,p,col,p.o&&p.o.s);

}
function wallSprite(d,side,theme,f,night){
  const key='W'+d.id+'|'+side+'|'+theme+'|'+f+'|'+(night?1:0);if(spriteCache[key])return spriteCache[key];

function silhouette(sp){

const view=mkCanvas(10,10),vg=view.getContext('2d');
let roomCv=null,gridCv=null;
function buildRoom(){
  const W=S.W,D=S.D,iw=(W+D)*16+MARGIN*2,ih=MARGIN*2+WALL_H+(W+D)*8+SLAB;
  OX=MARGIN+D*16;OY=MARGIN+WALL_H;view.width=iw;view.height=ih;

  for(let gy=0;gy<D;gy++)for(let gx=0;gx<W;gx++){

    for(let r=0;r<16;r++){

        const a=clamp((dy+dx/2)/2,0,7.99),b=clamp((dy-dx/2)/2,0,7.99);
        const c=st.fn(a,b,gx*8+a,gy*8+b),i=(y*iw+x)*4;
        dd[i]=c[0];dd[i+1]=c[1];dd[i+2]=c[2];dd[i+3]=255;
      }
    }
  }
  fg.putImageData(img,0,0);g.drawImage(fc,0,0);
  const wl=makeWall(S.wallL,D*16,.84),wr=makeWall(S.wallR,W*16,1),ll=D*16;
  for(let c=0;c<W*16;c++)g.drawImage(wr,c,0,1,WALL_H,OX+c,OY-WALL_H+(c>>1),1,WALL_H);
  for(let c=0;c<ll;c++)g.drawImage(wl,c,0,1,WALL_H,OX-ll+c,OY-WALL_H+((ll-1-c)>>1),1,WALL_H);
  outline(roomCv);
  gridCv=mkCanvas(iw,ih);const gg=gridCv.getContext('2d');gg.fillStyle='rgba(255,255,255,.28)';
  for(let gy=0;gy<D;gy++)for(let gx=0;gx<W;gx++){
    const tx=OX+16*(gx-gy),ty=OY+8*(gx+gy);
    for(let i=0;i<16;i++){gg.fillRect(tx+i,ty+(i>>1),1,1);gg.fillRect(tx-i,ty+(i>>1),1,1);gg.fillRect(tx-16+i,ty+8+(i>>1),1,1);gg.fillRect(tx+16-i,ty+8+(i>>1),1,1);}
  }
  layout();
}

/* ---------------- aturan penempatan ---------------- */
function cellsOf(v,gx,gy){const out=[];if(v.cells)for(const [cx,cy] of v.cells)out.push([gx+cx,gy+cy]);else for(let y=0;y<v.fd;y++)for(let x=0;x<v.fw;x++)out.push([gx+x,gy+y]);return out;}
function canPlaceFloor(d,rot,gx,gy,ignore){
  const v=getVariant(d,rot,0);
  if(gx<0||gy<0||gx+v.fw>S.W||gy+v.fd>S.D)return false;
  const layer=d.layer||'obj',mine=new Set(cellsOf(v,gx,gy).map(c=>c[0]+','+c[1]));
  for(const o of S.items){
    if(o.id===ignore)continue;const od=DEFS[o.def];if(od.wall||(od.layer||'obj')!==layer)continue;
    for(const c of cellsOf(getVariant(od,o.rot,0),o.gx,o.gy))if(mine.has(c[0]+','+c[1]))return false;
  }
  return true;
}
function canPlaceWall(d,side,s,ignore){
  const len=side==='R'?S.W:S.D;if(s<0||s+d.wt>len)return false;
  for(const o of S.items){
    if(o.id===ignore)continue;const od=DEFS[o.def];if(!od.wall||o.side!==side)continue;
    if(s<o.gx+od.wt&&o.gx<s+d.wt&&d.elev<od.elev+od.ht&&od.elev<d.elev+d.ht)return false;
  }
  return true;
}
function addItem(id,gx,gy,rot,side,theme){
  const d=DEFS[id];if(!d)return null;
  const ok=d.wall?canPlaceWall(d,side,gx,-1):canPlaceFloor(d,rot||0,gx,gy,-1);
  if(!ok){console.warn('tidak muat',id,gx,gy);return null;}
  const it={id:S.nextId++,def:id,gx,gy:d.wall?0:gy,rot:d.wall?0:(rot||0),theme:theme||S.theme};if(d.wall)it.side=side;
  S.items.push(it);return it;
}

/* ---------------- koordinat ---------------- */
let dpr=1,dispScale=1,offX=0,offY=0;
const cv=$('#cv'),dctx=cv.getContext('2d');
function resize(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));layout();}
function layout(){
  const cw=cv.width,ch=cv.height;let s=Math.min((cw-10*dpr)/view.width,(ch-10*dpr)/view.height);
  s=Math.max(1,Math.floor(s*2)/2);dispScale=s;offX=Math.round((cw-view.width*s)/2);offY=Math.round((ch-view.height*s)/2);
}
function toView(e){const r=cv.getBoundingClientRect();return [((e.clientX-r.left)*dpr-offX)/dispScale,((e.clientY-r.top)*dpr-offY)/dispScale];}
function toTile(ix,iy){const rx=ix-OX,ry=iy-OY;return [ry/16+rx/32,ry/16-rx/32];}
function wallAt(ix,iy){
  const rx=ix-OX,ry=iy-OY;
  if(rx>=0&&rx<16*S.W){const base=rx/2;if(ry<=base+1&&ry>=base-WALL_H)return {side:'R',t:rx/16};}
  if(rx<0&&-rx<16*S.D){const base=-rx/2;if(ry<=base+1&&ry>=base-WALL_H)return {side:'L',t:-rx/16};}
  return null;
}
function wallSpot(d,w){const len=w.side==='R'?S.W:S.D;return clamp(Math.round(w.t-d.wt/2),0,len-d.wt);}

/* ---------------- render ---------------- */
function itemPos(it){
  const d=DEFS[it.def];
  if(d.wall){const s=it.gx;return it.side==='R'?[OX+16*s-WP,OY+8*s-d.elev-d.ht-WP]:[OX-16*(s+d.wt)-WP,OY+8*s-d.elev-d.ht-WP];}
  return [OX+16*(it.gx-it.gy),OY+8*(it.gx+it.gy)];
}
function spriteOf(it,t){
  const d=DEFS[it.def],f=frameOf(d,t);
  return d.wall?wallSprite(d,it.side,it.theme,f,S.night):getSprite(d,it.rot,it.theme,f);
}
function drawItem(g,it,t,opt){
  const d=DEFS[it.def],sp=spriteOf(it,t),p=itemPos(it);
  const x=d.wall?p[0]:p[0]-sp.ox,y=d.wall?p[1]:p[1]-sp.oy;
  if(opt.sel){const sil=silhouette(sp);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])g.drawImage(sil,x+dx,y+dy);}

}
function ordered(extra,withC){
  const walls=[],flats=[],objs=[],airs=[],list=extra?S.items.concat([extra]):S.items;
  for(const it of list){const d=DEFS[it.def];if(d.wall)walls.push(it);else if(d.layer==='flat')flats.push(it);else if(d.layer==='air')airs.push(it);else objs.push(it);}
  const gb=it=>{const v=getVariant(DEFS[it.def],it.rot,0);return [it.gx,it.gx+v.fw,it.gy,it.gy+v.fd];};
  let mid=sortBoxes(withC&&SH.on?objs.concat(walkers()):objs,gb);
  if(withC&&SH.on)mid=placeSeated(mid);
  return walls.concat(flats,mid,sortBoxes(airs,gb));
}
function footprint(g,it,color){
  const d=DEFS[it.def];if(d.wall)return;
  for(const [x,y] of cellsOf(getVariant(d,it.rot,0),it.gx,it.gy))fillTile(g,OX+16*(x-y),OY+8*(x+y),color);
}
function drawFx(g,it,t){
  const d=DEFS[it.def];if(d.wall||!d.fx)return;
  const v=getVariant(d,it.rot,frameOf(d,t)),ax=OX+16*(it.gx-it.gy),ay=OY+8*(it.gx+it.gy);
  for(const fx of v.fx){
    for(let k=0;k<3;k++){
      const ph=((t/1100)+k/3+fx.x*.13)%1;
      const sx=Math.round(ax+2*(fx.x-fx.y)+Math.sin(t/380+k*2.1+fx.x)*1.3),sy=Math.round(ay+(fx.x+fx.y)-fx.z-ph*11);
      g.globalAlpha=(1-ph)*.85;g.fillStyle='#fff';g.fillRect(sx,sy,k===1?2:1,2);
    }
    g.globalAlpha=1;
  }
}
function lights(t){
  const L=[];
  for(const it of S.items){
    const d=DEFS[it.def];if(!d.light)continue;
    if(d.wall){const sp=spriteOf(it,t),p=itemPos(it);L.push({x:p[0]+sp.cv.width/2,y:p[1]+sp.cv.height/2,r:d.light.r,c:d.light.color||'#ffc66e'});}
    else{const v=getVariant(d,it.rot,frameOf(d,t));if(!v.light)continue;const ax=OX+16*(it.gx-it.gy),ay=OY+8*(it.gx+it.gy);L.push({x:ax+2*(v.light.x-v.light.y),y:ay+(v.light.x+v.light.y)-v.light.z,r:v.light.r,c:v.light.color||'#ffc66e'});}
  }
  return L;
}
function render(t){
  const g=vg;g.globalCompositeOperation='source-over';g.clearRect(0,0,view.width,view.height);
  g.drawImage(roomCv,0,0);
  const placing=S.mode==='place'||S.mode==='paint'||(S.drag&&S.drag.moved);
  if(placing)g.drawImage(gridCv,0,0);
  let ghost=null;
  if(S.mode==='place'&&S.ghost)ghost=S.ghost;
  const sel=S.items.find(i=>i.id===S.sel);
  if(sel&&!(S.drag&&S.drag.moved&&!S.drag.valid))footprint(g,sel,'rgba(255,230,120,.38)');
  if(S.drag&&S.drag.moved){const it=S.items.find(i=>i.id===S.drag.id);if(it)footprint(g,it,S.drag.valid?'rgba(120,230,130,.45)':'rgba(255,70,70,.5)');}
  if(ghost)footprint(g,ghost,ghost.valid?'rgba(120,230,130,.45)':'rgba(255,70,70,.5)');
  for(const it of ordered(ghost,true)){
    if(it.cust){drawCust(g,it.cust,t);continue;}
    const isG=it===ghost,isSel=sel&&it.id===sel.id,bad=(isG&&!ghost.valid)||(S.drag&&S.drag.moved&&S.drag.id===it.id&&!S.drag.valid);
    drawItem(g,it,t,{alpha:isG?.78:1,bad,sel:isSel});
    if(!isG)drawFx(g,it,t);
  }
  if(S.night){
    g.globalCompositeOperation='source-atop';g.fillStyle='rgba(14,20,66,.54)';g.fillRect(0,0,view.width,view.height);
    for(const l of lights(t)){
      const c=hex2rgb(l.c);
      for(let k=0;k<4;k++){g.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+',.12)';g.beginPath();g.arc(l.x,l.y,l.r*(1-k*.24),0,Math.PI*2);g.fill();}
    }
    g.globalCompositeOperation='source-over';
  }
  bzOverlay(g,t);
  dctx.clearRect(0,0,cv.width,cv.height);dctx.imageSmoothingEnabled=false;
  dctx.drawImage(view,0,0,view.width,view.height,offX,offY,Math.round(view.width*dispScale),Math.round(view.height*dispScale));
  bzFloat();
}

/* ---------------- hit test ---------------- */
function hitItem(ix,iy,t){
  const list=ordered(null);
  for(let i=list.length-1;i>=0;i--){
    const it=list[i],d=DEFS[it.def],sp=spriteOf(it,t),p=itemPos(it);
    const x=Math.floor(ix-(d.wall?p[0]:p[0]-sp.ox)),y=Math.floor(iy-(d.wall?p[1]:p[1]-sp.oy));
    if(x<0||y<0||x>=sp.cv.width||y>=sp.cv.height)continue;
    if(sp.cv.getContext('2d').getImageData(x,y,1,1).data[3]>40)return it;
  }
  return null;
}

function restore(str){
  const o=JSON.parse(str);
  S.W=o.W;S.D=o.D;S.floor=o.floor;S.wallL=o.wallL;S.wallR=o.wallR;S.items=(o.items||[]).filter(i=>DEFS[i.def]);S.theme=THEMES[o.theme]?o.theme:'japandi';S.night=!!o.night;S.nextId=o.nextId||(S.items.reduce((m,i)=>Math.max(m,i.id),0)+1);S.lastFloor=o.lastFloor||'kayu';if(o.bz){BZ.money=o.bz.money;BZ.day=o.bz.day;BZ.total=o.bz.total||0;}

function startPlace(id){

function updateGhost(ix,iy){
  const d=DEFS[S.placeDef];if(!d){S.ghost=null;return;}
  if(d.wall){
    const w=wallAt(ix,iy);if(!w){S.ghost=null;return;}
    const s=wallSpot(d,w);S.ghost={id:-1,def:d.id,gx:s,gy:0,rot:0,side:w.side,theme:S.theme,valid:canPlaceWall(d,w.side,s,-1)};
  }else{
    const v=getVariant(d,S.placeRot,0),[fx,fy]=toTile(ix,iy);
    const gx=clamp(Math.round(fx-v.fw/2),0,S.W-v.fw),gy=clamp(Math.round(fy-v.fd/2),0,S.D-v.fd);
    S.ghost={id:-1,def:d.id,gx,gy,rot:S.placeRot,theme:S.theme,valid:canPlaceFloor(d,S.placeRot,gx,gy,-1)};
  }
}
function commitGhost(){
  const g=S.ghost;if(!g)return;
  if(!g.valid){toast('Nggak muat di situ');return;}
  const cost=bcost(priceOf(g.def));if(!afford(cost))return;
  pushUndo();const d=DEFS[g.def];spend(cost);
  addItem(g.def,g.gx,g.gy,g.rot,g.side,g.theme);
  afterChange(S.gm==='bisnis');if(cost)toast(d.name+'  −'+rp(cost));
}
function rotateSel(){
  const it=getItem(S.sel);if(!it)return;const d=DEFS[it.def];
  if(d.wall){
    const ns=it.side==='R'?'L':'R',len=ns==='R'?S.W:S.D,s=clamp(it.gx,0,len-d.wt);
    if(!canPlaceWall(d,ns,s,it.id)){toast('Dinding sebelah penuh');return;}
    pushUndo();it.side=ns;it.gx=s;afterChange(false);return;
  }
  const old=getVariant(d,it.rot,0),nr=(it.rot+1)%4,nv=getVariant(d,nr,0);
  const cx=it.gx+old.fw/2,cy=it.gy+old.fd/2;
  const cand=[[clamp(Math.round(cx-nv.fw/2),0,S.W-nv.fw),clamp(Math.round(cy-nv.fd/2),0,S.D-nv.fd)],[it.gx,it.gy]];
  for(const [gx,gy] of cand){if(canPlaceFloor(d,nr,gx,gy,it.id)){pushUndo();it.rot=nr;it.gx=gx;it.gy=gy;afterChange(false);return;}}
  toast('Nggak muat kalau diputar');
}
function recolorSel(){
  const it=getItem(S.sel);if(!it)return;pushUndo();it.theme=THEME_IDS[(THEME_IDS.indexOf(it.theme)+1)%THEME_IDS.length];afterChange(false);toast('Warna: '+THEMES[it.theme].name);
}
function deleteSel(){
  if(SH.on)return;const it=getItem(S.sel);if(!it)return;pushUndo();
  let rf=0;if(S.gm==='bisnis'){rf=Math.floor(priceOf(it.def)/2);BZ.money+=rf;}
  S.items=S.items.filter(i=>i.id!==it.id);S.sel=null;afterChange(S.gm==='bisnis');if(rf)toast('Dijual +'+rp(rf));
}

/* pointer */
const P={down:false};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);P.down=true;const [ix,iy]=toView(e);
  if(SH.on){shiftTap(ix,iy);return;}
  if(S.mode==='place'){updateGhost(ix,iy);}
  else if(S.mode==='paint'){pushUndo();paintAt(ix,iy);}
  else{
    const hit=hitItem(ix,iy,performance.now());
    if(hit){
      selectItem(hit.id);
      const [fx,fy]=toTile(ix,iy);
      S.drag={id:hit.id,ox:hit.gx-fx,oy:hit.gy-fy,orig:{gx:hit.gx,gy:hit.gy,side:hit.side},sx:ix,sy:iy,moved:false,valid:true,snap:core()};
    }else selectItem(null);
  }
});
cv.addEventListener('pointermove',e=>{
  if(SH.on)return;const [ix,iy]=toView(e);
  if(S.mode==='place')updateGhost(ix,iy);
  else if(S.mode==='paint'&&P.down)paintAt(ix,iy);
  else if(S.drag&&P.down){
    const dr=S.drag,it=getItem(dr.id),d=DEFS[it.def];
    if(!dr.moved){if(Math.hypot(ix-dr.sx,iy-dr.sy)<3)return;dr.moved=true;}
    if(d.wall){const w=wallAt(ix,iy);if(w){it.side=w.side;it.gx=wallSpot(d,w);}dr.valid=canPlaceWall(d,it.side,it.gx,it.id);}
    else{const v=getVariant(d,it.rot,0),[fx,fy]=toTile(ix,iy);it.gx=clamp(Math.round(fx+dr.ox),0,S.W-v.fw);it.gy=clamp(Math.round(fy+dr.oy),0,S.D-v.fd);dr.valid=canPlaceFloor(d,it.rot,it.gx,it.gy,it.id);}
  }
});
function pointerEnd(){
  if(!P.down)return;P.down=false;if(SH.on)return;
  if(S.mode==='place')commitGhost();
  else if(S.mode==='paint'){afterChange(false);}
  else if(S.drag){
    const dr=S.drag,it=getItem(dr.id);
    if(dr.moved&&it){
      if(dr.valid){pushUndo(dr.snap);afterChange(false);}
      else{it.gx=dr.orig.gx;it.gy=dr.orig.gy;if(dr.orig.side)it.side=dr.orig.side;toast('Nggak muat di situ');}
    }
    S.drag=null;
  }
}
cv.addEventListener('pointerup',pointerEnd);
cv.addEventListener('pointercancel',()=>{P.down=false;S.drag&&getItem(S.drag.id)&&Object.assign(getItem(S.drag.id),S.drag.orig);S.drag=null;});
cv.addEventListener('pointerleave',()=>{if(S.mode==='place'&&!P.down)S.ghost=null;});
let paintDirty=false;
function paintAt(ix,iy){
  const [fx,fy]=toTile(ix,iy),gx=Math.floor(fx),gy=Math.floor(fy);
  if(gx<0||gy<0||gx>=S.W||gy>=S.D)return;
  if(S.floor[gy][gx]===S.paintStyle)return;
  if(S.gm==='bisnis'){if(BZ.money<5){toast('Uang kurang buat cat lantai');return;}BZ.money-=5;updateHud();}
  S.floor[gy][gx]=S.paintStyle;S.lastFloor=S.paintStyle;buildRoom();
}
window.addEventListener('keydown',e=>{
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(SH.on)return;
  const k=e.key.toLowerCase();
  if(k==='r'){if(S.mode==='place'){S.placeRot=(S.placeRot+1)%4;if(S.ghost){const d=DEFS[S.placeDef];if(!d.wall){const v=getVariant(d,S.placeRot,0);S.ghost.rot=S.placeRot;S.ghost.gx=clamp(S.ghost.gx,0,S.W-v.fw);S.ghost.gy=clamp(S.ghost.gy,0,S.D-v.fd);S.ghost.valid=canPlaceFloor(d,S.placeRot,S.ghost.gx,S.ghost.gy,-1);}}}else rotateSel();}
  else if(k==='delete'||k==='backspace'){deleteSel();}
  else if(k==='escape'){if(S.mode!=='select')endMode();else selectItem(null);}
  else if(k==='z'&&(e.ctrlKey||e.metaKey)){undo();e.preventDefault();}
});

/* grid & jalan */
function bzGrid(){
  const blk=Array.from({length:S.D},()=>Array(S.W).fill(0));
  for(const it of S.items){const d=DEFS[it.def];if(d.wall||(d.layer||'obj')!=='obj')continue;
    for(const [x,y] of cellsOf(getVariant(d,it.rot,0),it.gx,it.gy))if(blk[y]&&blk[y][x]!=null)blk[y][x]=1;}
  return blk;
}
function bfs(blk,sx,sy,allowT){
  const W=S.W,D=S.D,dist=Array.from({length:D},()=>Array(W).fill(-1)),prev={},q=[[sx,sy]];dist[sy][sx]=0;
  for(let h=0;h<q.length;h++){const [x,y]=q[h];
    for(const [dx,dy] of N4){const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=W||ny>=D||dist[ny][nx]>=0)continue;
      if(blk[ny][nx]&&!(allowT&&allowT[0]===nx&&allowT[1]===ny))continue;
      dist[ny][nx]=dist[y][x]+1;prev[nx+','+ny]=[x,y];q.push([nx,ny]);}}
  return {dist,prev};
}
function pathTo(blk,from,to){
  if(from[0]<0||from[1]<0||from[0]>=S.W||from[1]>=S.D)return null;
  const {dist,prev}=bfs(blk,from[0],from[1],to);
  if(dist[to[1]][to[0]]<0)return null;
  const out=[];let c=to;while(c[0]!==from[0]||c[1]!==from[1]){out.push(c);c=prev[c[0]+','+c[1]];}
  return out.reverse();
}

const BZ={money:600,day:1,total:0};
const SH={on:false,t:0,dur:180,closing:false,tail:0,custs:[],nid:1,spawnT:0,L:null,queue:[],pick:[],jobs:{},seats:[],stats:null,speed:1,autoT:0,flt:[],hint:'',uiT:0,lastSig:''};

function bzLayout(){
  const blk=bzGrid(),W=S.W,D=S.D,L={blk,warn:[]};
  let door=null;
  for(const it of S.items){if(!/^pintu/.test(it.def))continue;const d=DEFS[it.def];
    for(let k=0;k<d.wt&&!door;k++){const c=it.side==='R'?[it.gx+k,0]:[0,it.gx+k];if(c[0]<W&&c[1]<D&&!blk[c[1]][c[0]])door=[c[0],c[1],it.side];}}
  if(!door){L.warn.push('Pasang pintu dulu (tab Hiasan) — pelanggan butuh jalan masuk.');return L;}
  L.door=[door[0],door[1]];L.side=door[2];
  const reach=bfs(blk,door[0],door[1]);
  if(!S.items.some(i=>DEFS[i.def].char))L.warn.push('Butuh minimal 1 barista (tab Barista).');
  const kas=S.items.filter(i=>i.def==='kasir');
  if(!kas.length)L.warn.push('Butuh Kasir (tab Barista).');
  if(!S.items.some(i=>i.def==='espresso'||i.def==='brewBar'))L.warn.push('Butuh Bar Espresso atau Brew Bar buat bikin kopi.');
  let best=null;
  for(const k of kas)for(const [dx,dy] of N4){const x=k.gx+dx,y=k.gy+dy;if(x<0||y<0||x>=W||y>=D||blk[y][x])continue;const dd=reach.dist[y][x]-(dy===1?3:0);if(reach.dist[y][x]<0)continue;if(!best||dd<best.dd)best={x,y,dd};}
  if(kas.length&&!best){L.warn.push('Kasir nggak bisa dijangkau — sisakan petak kosong di depannya.');}
  if(!best)return L;
  L.spot=[best.x,best.y];
  const fs=bfs(blk,best.x,best.y),cells=[];
  for(let y=0;y<D;y++)for(let x=0;x<W;x++)if(fs.dist[y][x]>=0&&!(x===door[0]&&y===door[1]))cells.push([x,y,fs.dist[y][x]]);
  cells.sort((a,b)=>a[2]-b[2]||a[1]-b[1]||a[0]-b[0]);
  L.slots=cells.slice(0,11).map(c=>[c[0],c[1]]);
  L.pickN=Math.max(0,Math.min(4,L.slots.length-4));L.qcap=Math.max(1,Math.min(6,L.slots.length-L.pickN));
  if(L.slots.length<4)L.warn.push('Ruang terlalu sempit buat antre — kosongkan beberapa petak.');
  const seats=[];
  for(const it of S.items){if(!SEATS.has(it.def))continue;
    for(const [x,y] of cellsOf(getVariant(DEFS[it.def],it.rot,0),it.gx,it.gy)){
      let t=null,td=9;
      for(const tb of S.items){if(!TABLES.has(tb.def))continue;
        for(const [tx,ty] of cellsOf(getVariant(DEFS[tb.def],tb.rot,0),tb.gx,tb.gy)){
          if(Math.max(Math.abs(tx-x),Math.abs(ty-y))>1)continue;const md=Math.abs(tx-x)+Math.abs(ty-y);if(md<td){td=md;t=[tx,ty];}}}
      if(!t)continue;
      let ok=false;for(const [dx,dy] of N4){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<W&&ny<D&&!blk[ny][nx]&&reach.dist[ny][nx]>=0)ok=true;}
      if(!ok)continue;
      const dx=t[0]-x,dy=t[1]-y;
      seats.push({it,x,y,rot:Math.abs(dy)>=Math.abs(dx)?(dy>=0?0:2):(dx>0?3:1),taken:0,md:Math.abs(x-best.x)+Math.abs(y-best.y)});
    }}
  L.seats=seats;
  return L;
}

  if(sn.length&&Math.random()<.45)items.push(mkIt(pickW(sn)));

const cellOf=c=>[Math.floor(c.x),Math.floor(c.y)];

  const p=pathTo(SH.L.blk,from,cell);
  if(p)c.path=out?[[from[0],from[1]]].concat(p):p;else if(cc[0]===cell[0]&&cc[1]===cell[1])c.path=[];
  return !!p;
}
function advanceQueue(){SH.queue.forEach((c,i)=>{c.qi=i;goto(c,SH.L.slots[i]);});}

function freePick(){for(let p=0;p<SH.L.pickN;p++)if(!SH.pick[p])return p;return -1;}

function startLeave(c,angry){
  if(c.st==='leave')return;
  if(SH.queue.includes(c)){SH.queue.splice(SH.queue.indexOf(c),1);advanceQueue();}
  if(c.seat)c.seat.taken=0;if(c.pp>=0&&SH.pick[c.pp]===c)SH.pick[c.pp]=null;
  for(const sid in SH.jobs)if(SH.jobs[sid].c===c){SH.jobs[sid].it.s='x';delete SH.jobs[sid];}
  if(c.order)for(const it of c.order.items)if(it.s==='wait'||it.s==='make'||it.s==='ready')it.s='x';
  c.st='leave';c.sit=false;c.angry=!!angry;
  if(angry){SH.stats.lost++;float(c,'kabur','#d9534f');}

function float(c,txt,col){SH.flt.push({x:c.x,y:c.y,txt,col:col||'#2f7a3a',t:0});}

function takeOrder(c){

  if(!seat){pp=freePick();if(pp<0){toast('Tempat tunggu pickup penuh — layani pesanan dulu');return;}}
  const items=genOrder();if(!items.length){toast('Belum ada menu — pasang mesin dulu');return;}
  c.order={items,ot:SH.t};c.dine=!!seat;
  SH.queue.shift();advanceQueue();
  c.pat=Math.min(1,c.pat+.4);
  if(seat){seat.taken=c.id;c.seat=seat;c.st='toSeat';goto(c,[seat.x,seat.y]);}
  else{SH.pick[pp]=c;c.pp=pp;c.st='toPick';goto(c,pickSlot(pp));}
  toast((c.dine?'Dine-in: ':'Take-away: ')+items.map(i=>MENU[i.k].n.replace(' Ruang','')+(i.v==='x'?'':(i.v==='ice'?' (Ice)':' (Hot)'))).join(', '));
}
function pendingFor(kind){

    for(const it of c.order.items){if(it.s!=='wait'||MENU[it.k].st!==kind)continue;if(!best||c.order.ot<best.c.order.ot)best={c,it};}}

function startJob(st,it,c,auto){it.s='make';SH.jobs[st.id]={st,it,c,t:0,need:MENU[it.k].t,auto:!!auto};}

function deliver(c){

    const pend=c.order.items.find(i=>i.s==='wait'||i.s==='make');
    toast(pend?'Pesanannya belum jadi — ketuk '+DEFS[MENU[pend.k].st].name:'');return;
  }

  c.got+=sum;BZ.money+=sum;BZ.total+=sum;SH.stats.earned+=sum;SH.stats.sold+=rd.length;
  float(c,'+'+sum+'rb');

    if(tip>0){BZ.money+=tip;BZ.total+=tip;SH.stats.tips+=tip;SH.flt.push({x:c.x,y:c.y,txt:'tip +'+tip+'rb',col:'#c58a1a',t:-.5});}

}
function tapCust(c){
  if(c.st==='q'){
    if(SH.queue[0]===c&&!c.path.length)takeOrder(c);else toast('Layani pelanggan paling depan dulu');
    return true;
  }

}
function tapStation(st){

  const o=pendingFor(st.def);
  if(!o){toast('Belum ada pesanan buat '+DEFS[st.def].name);return true;}
  startJob(st,o.it,o.c);return true;
}

/* ---------- loop simulasi ---------- */
function stepWalk(c,dt){
  c.walk=false;if(!c.path.length)return;
  const [tx,ty]=c.path[0],wx=tx+.5,wy=ty+.5,dx=wx-c.x,dy=wy-c.y,dist=Math.hypot(dx,dy),sp=2.2*dt;
  c.walk=true;
  if(Math.abs(dx)>.02||Math.abs(dy)>.02)c.rot=Math.abs(dy)>=Math.abs(dx)?(dy>0?0:2):(dx>0?3:1);
  if(dist<=sp){c.x=wx;c.y=wy;c.path.shift();}else{c.x+=dx/dist*sp;c.y+=dy/dist*sp;}
}
function updCust(c,dt){
  c.age+=dt;
  if(c.fade){c.alpha-=dt*2.4;if(c.alpha<=0)c.gone=true;return;}
  if(c.alpha<1)c.alpha=Math.min(1,c.alpha+dt*2.4);
  stepWalk(c,dt);
  const n=c.order?c.order.items.length:1;
  switch(c.st){
    case 'q':
      c.pat-=dt/42;
      if(c.pat<=0)startLeave(c,true);break;
    case 'toSeat':case 'toPick':
      if(!c.path.length){c.st='wait';if(c.seat){c.sit=true;c.x=c.seat.x+.5;c.y=c.seat.y+.5;c.rot=c.seat.rot;}}break;
    case 'wait':
      c.pat-=dt/((48+8*n)*(c.dine?1.3:1));
      if(c.pat<=0)startLeave(c,true);break;
    case 'eat':
      c.eatT-=dt;if(c.eatT<=0)startLeave(c,false);break;
    case 'leave':
      if(!c.path.length)c.fade=true;break;
  }
}
function bzTick(dt){
  if(!SH.on)return;dt*=SH.speed;SH.t+=dt;
  if(!SH.closing){
    SH.spawnT-=dt;if(SH.spawnT<=0){spawnCust();SH.spawnT=nextGap();}
    if(SH.t>=SH.dur)SH.closing=true;
  }else SH.tail+=dt;
  for(const sid of Object.keys(SH.jobs)){const j=SH.jobs[sid];if(!j)continue;j.t+=dt;if(j.t>=j.need)finishJob(sid);}
  SH.autoT+=dt;
  if(SH.autoT>=.7){
    SH.autoT=0;
    const nb=S.items.filter(i=>DEFS[i.def].char).length,auto=Math.min(2,Math.max(0,nb-1));
    let run=Object.values(SH.jobs).filter(j=>j.auto).length;
    if(run<auto)for(const st of S.items){if(run>=auto)break;if(!STN.includes(st.def)||SH.jobs[st.id])continue;const o=pendingFor(st.def);if(o){startJob(st,o.it,o.c,true);run++;}}
  }
  for(const c of SH.custs.slice())updCust(c,dt);
  SH.custs=SH.custs.filter(c=>!c.gone);
  for(const f of SH.flt)f.t+=dt;SH.flt=SH.flt.filter(f=>f.t<1.4);
  if(SH.closing&&SH.tail>40)for(const c of SH.custs)if(c.st!=='leave')startLeave(c,true);
  if(SH.closing&&!SH.custs.length)endShift(false);
  SH.uiT-=dt;if(SH.uiT<=0){SH.uiT=.25;uiRefresh();}
}

function placeSeated(list){

  if(!Object.keys(by).length)return list;

  for(const it of list){out.push(it);const a=by[it.id];if(a){a.sort((p,q)=>(p.x+p.y)-(q.x+q.y));for(const c of a)out.push({id:'c'+c.id,def:'__cust',cust:c});}}
  return out;

function hitCust(ix,iy,loose){
  let best=null,bd=-1e9;
  for(const c of SH.custs){if(c.alpha<.5||c.fade)continue;
    const ax=OX+16*(c.x-c.y),ay=OY+8*(c.x+c.y)-8;
    if(loose){if(ix>=ax-12&&ix<=ax+12&&iy>=ay-(c.sit?28:34)&&iy<=ay+12&&ay>bd){best=c;bd=ay;}continue;}
    if(Math.abs(ix-ax)<=14&&iy>=ay-(c.sit?25:30)-24&&iy<=ay-(c.sit?25:30)-3&&(c.order?(c.st==='wait'||c.st==='toSeat'||c.st==='toPick'):(SH.queue[0]===c&&!c.path.length))){if(ay>bd){best=c;bd=ay;}continue;}
    const sp=custSprite(c.look,c.rot,0,c.sit),lx=Math.floor(ix-Math.round(ax-sp.ox)),ly=Math.floor(iy-Math.round(ay-sp.oy));
    if(lx<1||ly<1||lx>=sp.cv.width-1||ly>=sp.cv.height-1)continue;
    const d=sp.cv.getContext('2d').getImageData(lx-1,ly-1,3,3).data;let hit=false;for(let i=3;i<36;i+=4)if(d[i]>40){hit=true;break;}
    if(hit&&ay>bd){best=c;bd=ay;}
  }
  return best;
}
function bzOverlay(g,t){

  const bob=Math.round(Math.sin(t/260));
  for(const c of SH.custs){
    if(c.alpha<.4||c.fade)continue;
    const ax=Math.round(OX+16*(c.x-c.y)),ay=Math.round(OY+8*(c.x+c.y)-8),top=ay-(c.sit?25:30);
    const front=SH.queue[0]===c&&c.st==='q'&&!c.path.length;
    let by=top-3;
    if(c.st!=='eat'&&c.st!=='leave'&&c.st!=='toSeat'&&c.st!=='toPick'&&(c.order||c.pat<.7||front)){patBar(g,ax,top-1,c.pat);by=top-5;}
    if(front){bub(g,ax,by+bob,13,13,'#fff2b8');R(g,ax-1,by+bob-10,2,5,'#d9534f');R(g,ax-1,by+bob-4,2,2,'#d9534f');}
    else if(c.order&&(c.st==='wait'||c.st==='toSeat'||c.st==='toPick')){
      const its=c.order.items.filter(i=>i.s!=='done'&&i.s!=='x');
      if(its.length){
        const w=its.length*12+2,anyR=its.some(i=>i.s==='ready'),x0=Math.round(ax-w/2)+2;
        bub(g,ax,by+bob,w,14,anyR?'#c9f0c4':'#ffffff');
        its.forEach((it,i)=>{g.globalAlpha=it.s==='make'?.55:1;g.drawImage(icon(iconKey(it)),x0+i*12,by+bob-13);g.globalAlpha=1;if(it.s==='ready')R(g,x0+i*12+1,by+bob-2,9,1,'#2f9a3a');});
      }
    }else if(c.st==='leave'&&c.angry){bub(g,ax,by+bob,11,11,'#ffd0c8');R(g,ax-1,by+bob-8,2,4,'#d9534f');R(g,ax-1,by+bob-3,2,2,'#d9534f');}
  }

      R(g,sx-9,sy+3,18,4,OLN);R(g,sx-8,sy+4,Math.round(16*Math.min(1,job.t/job.need)),2,job.auto?'#6fa8dc':'#5fbf5a');

      if(o){const b=Math.round(Math.sin(t/200)*1.5);bub(g,sx,sy+b,14,14,'#fff2b8');g.drawImage(icon(iconKey(o.it)),sx-5,sy+b-13);}
    }
  }
}

  S.mode='select';S.placeDef=null;S.ghost=null;S.sel=null;S.drag=null;

  toast('Kedai dibuka! Ketuk pelanggan bertanda !');
}
function endShift(early){
  if(!SH.on)return;
  const st=SH.stats,day=BZ.day;SH.on=false;SH.custs=[];SH.jobs={};SH.flt=[];
  BZ.day++;flushSave();hudSig='';
  renderPanel();updateCtx();updateTop();updateHud();
  const stars=starsOf(vibeScore());
  let tip='Beli dekor dan item baru di tab bawah buat naikin vibe kedai.';
  if(st.lost>st.served&&st.lost>2)tip='Banyak pelanggan kabur. Tambah mesin, rekrut barista (auto bikin pesanan), atau tambah kursi.';
  else if(!availMenu().has('dn'))tip='Beli Etalase Kue biar bisa jual Donat & Saltbread — tambahan omzet per pelanggan.';
  else if(!availMenu().has('pf'))tip='Beli Panggangan Poffertjes buat nambah menu 25rb.';
  const body=el('div','recap');
  body.innerHTML='<div class="big">'+rp(st.earned+st.tips)+'</div>'
    +'<div class="rl"><span>Penjualan ('+st.sold+' item)</span><b>'+rp(st.earned)+'</b></div>'
    +'<div class="rl"><span>Tip</span><b>'+rp(st.tips)+'</b></div>'
    +'<div class="rl"><span>Pelanggan dilayani</span><b>'+st.served+'</b></div>'
    +'<div class="rl"><span>Pelanggan kabur</span><b>'+st.lost+'</b></div>'
    +'<div class="rl"><span>Vibe kedai</span><b>'+'★'.repeat(stars)+'</b></div>'
    +'<div class="rl"><span>Total uang</span><b>'+rp(BZ.money)+'</b></div>'
    +'<div class="note">'+tip+'</div>';
  showBox((early?'Tutup lebih awal — ':'')+'Hari '+day+' selesai',body,[['Lanjut dekor']]);
}
function shiftHint(){
  if(SH.custs.some(c=>c.order&&c.order.items.some(i=>i.s==='ready')))return 'Pesanan siap! Ketuk pelanggan dengan gelembung hijau buat nganter.';
  for(const st of S.items){if(!STN.includes(st.def)||SH.jobs[st.id])continue;const o=pendingFor(st.def);if(o)return 'Ketuk '+DEFS[st.def].name+' buat bikin '+MENU[o.it.k].n.replace(' Ruang','')+'.';}
  const f=SH.queue[0];
  if(f&&!f.path.length)return 'Ketuk pelanggan bertanda ! buat ambil pesanan.';
  return SH.closing?'Kedai tutup — layani sisa pelanggan.':'Nunggu pelanggan… ketuk pelanggan / mesin buat melayani.';
}
function hitStationBubble(ix,iy){
  for(const st of S.items){
    if(!STN.includes(st.def))continue;
    if(!SH.jobs[st.id]&&!pendingFor(st.def))continue;
    const v=getVariant(DEFS[st.def],st.rot,0),cx=st.gx+v.fw/2,cy=st.gy+v.fd/2,sx=OX+16*(cx-cy),sy=OY+8*(cx+cy)-36;
    if(Math.abs(ix-sx)<=10&&iy>=sy-18&&iy<=sy+6)return st;
  }
  return null;
}
function shiftTap(ix,iy){
  const sb=hitStationBubble(ix,iy);
  if(sb){tapStation(sb);uiRefresh(true);return;}
  const c=hitCust(ix,iy);
  if(c&&tapCust(c)){uiRefresh(true);return;}
  const it=hitItem(ix,iy,performance.now());
  if(!it){const c2=hitCust(ix,iy,true);if(c2&&tapCust(c2))uiRefresh(true);return;}
  {
    if(STN.includes(it.def)){tapStation(it);uiRefresh(true);return;}
    if(it.def==='kasir'){const f=SH.queue[0];if(f&&!f.path.length)takeOrder(f);else toast('Belum ada yang antre');uiRefresh(true);return;}
    const cells=cellsOf(getVariant(DEFS[it.def],it.rot,0),it.gx,it.gy);let best=null,bd=9;
    for(const st of S.items){if(!STN.includes(st.def)||SH.jobs[st.id]||!pendingFor(st.def))continue;
      for(const [x,y] of cellsOf(getVariant(DEFS[st.def],st.rot,0),st.gx,st.gy))for(const [cx,cy] of cells){const d=Math.max(Math.abs(x-cx),Math.abs(y-cy));if(d<bd){bd=d;best=st;}}}
    if(best&&bd<=1){tapStation(best);uiRefresh(true);}
  }
}
function ticketAction(c){
  if(c.order&&c.order.items.some(i=>i.s==='ready')){deliver(c);return;}
  const it=c.order&&c.order.items.find(i=>i.s==='wait');
  if(it){const st=S.items.find(s=>s.def===MENU[it.k].st&&!SH.jobs[s.id]);if(st)startJob(st,it,c);else toast('Mesinnya lagi dipakai');}
}
function uiRefresh(force){
  updateHud();
  const h=shiftHint();if(h!==SH.hint){SH.hint=h;const m=$('#ctx .msg');if(m)m.textContent=h;}
  const sig=SH.custs.filter(c=>c.order).map(c=>c.id+c.st+((c.pat*8)|0)+c.order.items.map(i=>i.s).join('')).join(',')+Object.keys(SH.jobs).length;
  if(force||sig!==SH.lastSig){SH.lastSig=sig;renderPanel();}
}
function shiftPanel(tabs,box){
  tabs.append(el('div','sec',SH.closing?'Kedai tutup — pesanan tersisa':'Pesanan masuk'));
  const list=SH.custs.filter(c=>c.order&&c.st!=='leave'&&c.order.items.some(i=>i.s!=='done'&&i.s!=='x'));
  if(!list.length){
    box.append(el('div','note','<b>Cara main</b><br>1. Ketuk pelanggan bertanda <b>!</b> di depan kasir buat ambil pesanan.<br>2. Ketuk mesin (Espresso, Etalase, dst) yang bergelembung buat bikin.<br>3. Pelanggan bergelembung hijau? Ketuk dia buat nganter. Uang masuk!<br>Pelanggan sabarnya terbatas — perhatikan bar di atas kepala.'));
  }
  list.forEach(c=>{
    const r=el('button','tk'+(c.order.items.some(i=>i.s==='ready')?' rdy':''));
    const top=el('div','tkt');
    top.append(el('b','',(c.dine?'Dine-in':'Take-away')+' #'+c.id));
    const bar=el('i','pbar'),fill=el('i','');fill.style.width=Math.round(c.pat*100)+'%';fill.style.background=c.pat>.55?'#5fbf5a':c.pat>.28?'#f2c94c':'#d9534f';bar.append(fill);top.append(bar);
    r.append(top);
    c.order.items.filter(i=>i.s!=='done'&&i.s!=='x').forEach(it=>{
      const row=el('div','tki'),cv=mkCanvas(22,22),g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(icon(iconKey(it)),0,0,22,22);
      const stt=it.s==='ready'?'siap — antar!':it.s==='make'?'dibikin…':'menunggu '+DEFS[MENU[it.k].st].name;
      row.append(cv,el('span','',MENU[it.k].n.replace(' Ruang','')+(it.v==='x'?'':(it.v==='ice'?' · Ice':' · Hot'))+'<small>'+stt+'</small>'));
      r.append(row);
    });
    r.onclick=()=>{ticketAction(c);uiRefresh(true);};
    box.append(r);
  });
  const row=el('div','row');const b=el('button','btn warn','Tutup kedai sekarang');b.onclick=()=>endShift(true);row.append(b);box.append(row);
}
function menuTab(box){
  box.append(el('div','sec','Menu & harga'));
  const av=availMenu();
  for(const k of MENU_KEYS){
    const m=MENU[k],r=el('div','mi'+(av.has(k)?'':' off')),cv=mkCanvas(33,33),g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(icon(m.drink?'ice':k),0,0,33,33);
    const pr=m.p.x!=null?rp(m.p.x):(m.p.hot?'Ice '+rp(m.p.ice)+' · Hot '+rp(m.p.hot):'Ice '+rp(m.p.ice));
    r.append(cv,el('div','',m.n+'<small>'+pr+'</small><small>'+(av.has(k)?'Tersedia':'Terkunci — butuh '+DEFS[m.st].name)+'</small>'));box.append(r);
  }
  const L0=bzLayout();
  box.append(el('div','sec','Tempat duduk'));
  box.append(el('div','note',L0.seats?'Kursi aktif: <b>'+L0.seats.length+'</b> (kursi yang dekat meja dan bisa dijangkau). Pelanggan dine-in pilih kursi ini; kalau penuh mereka jadi take-away.':'Belum bisa dihitung — pastikan ada pintu & kasir yang bisa dijangkau.'));
  const vs=vibeScore(),stars=starsOf(vs);
  box.append(el('div','sec','Vibe kedai'));
  box.append(el('div','note','Skor vibe: <b>'+Math.round(vs)+'</b> poin = '+'★'.repeat(stars)+(STARS[stars]!=null?'. Bintang berikutnya di '+STARS[stars]+' poin.':'. Sudah bintang maksimal!')+'<br>Dekor, hiasan dinding, meja, dan kursi menaikkan vibe. Bintang lebih tinggi = pelanggan lebih sering datang dan tip lebih gede.'));
  box.append(el('div','note','Barista tambahan (rekrut di tab Barista) otomatis ngerjain pesanan di mesin yang nganggur — maksimal 2 barista bantu.'));
}
/* ---------- mode & karier ---------- */
const hasSave=k=>{try{return !!localStorage.getItem(k);}catch(e){return false;}};
function chooseMode(first){
  if(SH.on){toast('Tutup kedai dulu sebelum ganti mode');return;}
  const body=el('div','mrow');
  const c1=el('button','mcard');c1.innerHTML='<b>Mode Bisnis</b><span>Jadi pengusaha kedai kopi. Layani pelanggan, kumpulin uang, beli dekor & mesin baru.</span>';
  c1.onclick=()=>{$('#gm').hidden=true;if(S.gm==='bisnis')return;if(hasSave(KEYB))switchMode('bisnis');else careerPicker();};
  const c2=el('button','mcard');c2.innerHTML='<b>Mode Santai</b><span>Dekor bebas tanpa batas. Semua item gratis, tanpa pelanggan.</span>';
  c2.onclick=()=>{$('#gm').hidden=true;if(S.gm==='santai'&&!first)return;switchMode('santai');};
  body.append(c1,c2);
  showBox(first?'Selamat datang di Ruang Kopi':'Pilih mode',body,first?[]:[['Batal']]);
}
function careerPicker(){
  const body=el('div','mrow');
  CATS.barista.filter(id=>DEFS[id].char).forEach(id=>{
    const c=el('button','card tall'),cvs=mkCanvas(120,116);drawPreview(cvs,DEFS[id]);c.append(cvs,el('span','',DEFS[id].name));
    c.onclick=()=>{$('#gm').hidden=true;newCareer(id);};body.append(c);
  });
  showBox('Pilih baristamu',body,hasSave(KEYB)||S.gm==='bisnis'?[['Batal']]:[]);
}
function switchMode(target){
  if(SH.on){toast('Tutup kedai dulu sebelum ganti mode');return;}
  if(S.items.length)flushSave();S.gm=target;try{localStorage.setItem(KEYM,target);}catch(e){}
  undoStack.length=0;let raw=null;try{raw=localStorage.getItem(target==='bisnis'?KEYB:KEYS);}catch(e){}
  if(raw)restore(raw);else if(target==='santai'){loadStarter();undoStack.length=0;}
  S.mode='select';S.placeDef=null;S.ghost=null;if(S.tab==='menu'&&target!=='bisnis')S.tab='barista';
  hudSig='';buildRoom();resize();afterChange(true);updateHud();
  toast(target==='bisnis'?'Mode Bisnis — lanjut kariermu':'Mode Santai — dekor bebas');
}
function newCareer(bid){
  if(SH.on)return;
  if(S.gm==='santai'&&S.items.length)flushSave();
  S.gm='bisnis';try{localStorage.setItem(KEYM,'bisnis');}catch(e){}
  undoStack.length=0;BZ.money=600;BZ.day=1;BZ.total=0;
  S.W=7;S.D=6;resetFloor('kayu');S.wallL='krem';S.wallR='bata';S.theme='japandi';S.night=false;S.items=[];S.sel=null;S.mode='select';S.placeDef=null;S.ghost=null;S.nextId=1;
  buildRoom();const A=addItem;
  A('tanaman',0,0,0);A('rakCangkir',2,0,0);A('grinder',3,0,0);A('counter1',4,0,0);A(bid,3,1,0);
  A('espresso',2,2,0);A('kasir',4,2,0);
  A('mejaKotak',2,4,0);A('kursi',1,4,3);A('kursi',3,4,1);A('mejaKotak',5,4,0);A('kursi',4,4,3);A('kursi',6,4,1);
  A('pintu',5,0,0,'R');A('menuboard',2,0,0,'R');A('jendela',1,0,0,'L');
  S.tab='barista';hudSig='';resize();afterChange(true);updateHud();flushSave();
  toast('Kedai pertamamu siap! Tekan Buka Kedai');
}
function bzBoot(){
  let mode=null,raw=null;
  try{mode=localStorage.getItem(KEYM);}catch(e){}
  try{
    if(mode==='bisnis'){raw=localStorage.getItem(KEYB);if(raw){S.gm='bisnis';restore(raw);return 'ok';}}
    else{raw=localStorage.getItem(KEYS);if(raw){S.gm='santai';restore(raw);return mode===null?'old':'ok';}}
  }catch(e){}
  return mode===null?'fresh':'nobiz';
}
const BIZ={BZ,SH,MENU,PRICE,bzLayout,startShift,endShift,tick:bzTick,vibeScore,starsOf,newCareer,switchMode,takeOrder,tapCust,tapStation,deliver,pendingFor,shiftHint,hitCust,uiRefresh,showBox,availMenu,spawnCust,icon,ticketAction,chooseMode};


/* ---------------- init ---------------- */
$('#bUndo').onclick=undo;
$('#bNight').onclick=()=>{S.night=!S.night;updateTop();renderPanel();save();};
$('#bShot').onclick=takePhoto;
$('#bClose').onclick=()=>{$('#modal').hidden=true;};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').hidden=true;});
new ResizeObserver(resize).observe($('#stage'));

const bootR=bzBoot();
buildRoom();resize();updateTop();updateCtx();updateEmpty();renderPanel();updateHud();
if(bootR==='fresh')chooseMode(true);else if(bootR==='nobiz')careerPicker();
else if(bootR==='old'){try{localStorage.setItem(KEYM,'santai');}catch(e){}
  showBox('Ada Mode Bisnis baru!','Sekarang kamu bisa jadi <b>pengusaha kedai kopi</b>: pelanggan datang, pesan kopi &amp; donat, kamu layani, uangnya buat beli dekor. Dekor santaimu yang lama tetap aman di Mode Santai.',[['Coba Mode Bisnis',()=>{if(hasSave(KEYB))switchMode('bisnis');else careerPicker();}],['Nanti aja']]);}
requestAnimationFrame(loop);
window.G={loadJaksel,PRESETS,FLOORS,WALLS,THEMES,getSprite,wallSprite,frameOf,S,DEFS,addItem,loadStarter,startPlace,render,buildRoom,canPlaceFloor,canPlaceWall,getVariant,toView,hitItem,applyPreset,renderPanel,setSize,undo,core,bz:BIZ,fillAllFloor,careerPicker,toClient:(ix,iy)=>{const r=cv.getBoundingClientRect();return [r.left+(offX+ix*dispScale)/dpr,r.top+(offY+iy*dispScale)/dpr];},custXY:c=>[OX+16*(c.x-c.y),OY+8*(c.x+c.y)-8],tileXY:(x,y)=>[OX+16*(x-y),OY+8*(x+y)+8]};
})();
